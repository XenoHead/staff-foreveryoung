<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In-Store Inventory | Forever Young Records</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #08111F;
      color: #FFF8DF;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    /* Brick Background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("images/brick-bg.png");
      background-size: 300px;
      opacity: 0.15;
      pointer-events: none;
      z-index: -1;
    }

    :root {
      --blue: #0A2C74;
      --yellow: #FFD447;
      --cream: #FFF8DF;
      --dark: #08111F;
      --green: #2ecc71;
      --red: #c0392b;
    }

    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 2rem;
      z-index: 10;
    }

    header img {
      height: 50px;
    }

    h1 {
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 2rem;
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 1200px;
      margin-bottom: 2rem;
      z-index: 10;
    }

    .panel h2 {
      font-family: 'Oswald', sans-serif;
      margin-bottom: 1.5rem;
      color: var(--yellow);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Action Buttons */
    .action-btn {
      background: transparent;
      border: 2px solid var(--blue);
      color: #fff;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .action-btn:hover {
      background: var(--blue);
      color: var(--yellow);
    }

    .action-btn.success {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .action-btn.success:hover {
      background: #27ae60;
      border-color: #27ae60;
      color: #fff;
    }

    /* Search Form UI */
    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      width: 100%;
      margin-bottom: 1rem;
    }

    .search-input-wrapper {
      flex: 2;
      min-width: 300px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      transition: all 0.3s;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--yellow);
      box-shadow: 0 0 10px rgba(255, 212, 71, 0.2);
    }

    /* Spinner */
    .loading-spinner {
      display: none;
      text-align: center;
      padding: 3rem;
      z-index: 10;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border-left-color: var(--yellow);
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Browse Letters Index */
    .browse-letters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .browse-letters a {
      color: #B6C0D7;
      text-decoration: none;
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .browse-letters a:hover {
      background: rgba(255, 212, 71, 0.2);
      color: var(--yellow);
    }

    .browse-letters a.active {
      background: var(--yellow);
      color: var(--dark);
      font-weight: 700;
    }

    /* Results list */
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .record-card {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0.75rem 1.2rem;
      gap: 1.5rem;
      transition: all 0.2s;
    }

    .record-card:hover {
      border-color: var(--blue);
      background: rgba(35, 84, 146, 0.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .record-art {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .record-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .record-info {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.5rem;
    }

    .record-text {
      flex: 1;
      min-width: 250px;
    }

    .record-title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.2rem;
      color: #FFF;
      margin-bottom: 0.1rem;
      line-height: 1.2;
    }

    .record-artist {
      color: var(--yellow);
      font-size: 0.9rem;
    }

    .record-details {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      flex: 2;
      font-size: 0.9rem;
      color: #B6C0D7;
    }

    .record-price {
      font-family: 'Oswald', sans-serif;
      font-size: 1.4rem;
      color: var(--yellow);
      font-weight: 500;
      min-width: 100px;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.2rem;
    }

    /* Pagination Styles */
    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin: 2rem 0;
      padding: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .page-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 212, 71, 0.3);
      color: var(--yellow);
      padding: 0.5rem 1.2rem;
      border-radius: 4px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .page-btn:hover:not(:disabled) {
      background: var(--yellow);
      color: var(--dark);
      box-shadow: 0 0 15px rgba(255, 212, 71, 0.25);
    }

    .loading-state {
      text-align: center;
      padding: 4rem;
      color: #B6C0D7;
    }

    .page-info {
      font-family: 'Oswald', sans-serif;
      font-size: 1.1rem;
      color: #FFF;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <div class="container" style="width: 100%; max-width: 1200px;">
    <header>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <img src="images/fyr-logo.png" alt="Forever Young Records">
        <h1>In-Store Inventory</h1>
      </div>
      <div style="display: flex; gap: 1rem;">
        <a href="index.html" class="action-btn">
          &larr; Dashboard
        </a>
        <a href="online-products.html" class="action-btn">
          Online Editor
        </a>
      </div>
    </header>

    <!-- Search Panel -->
    <div class="panel">
      <h2>In-Store Product Lookup</h2>
      <form id="search-form" class="search-row" action="#" method="GET">
        <div class="search-input-wrapper">
          <input type="text" id="search-query" placeholder="Search our in-store database (Artist, Title, UPC, Cat #)...">
        </div>

        <div style="flex: 0 1 140px; min-width: 120px;">
          <select id="search-limit">
            <option value="10" selected>10 per page</option>
            <option value="20">20 per page</option>
            <option value="40">40 per page</option>
            <option value="80">80 per page</option>
          </select>
        </div>

        <button type="submit" class="action-btn" style="background: var(--blue); color: var(--yellow);">Search</button>
      </form>

      <div class="browse-letters" id="letter-index">
        <span style="color: #B6C0D7; display: flex; align-items: center; margin-right: 0.5rem; font-family: 'Oswald', sans-serif;">BROWSE:</span>
        <a href="#">#</a>
        <a href="#">A</a>
        <a href="#">B</a>
        <a href="#">C</a>
        <a href="#">D</a>
        <a href="#">E</a>
        <a href="#">F</a>
        <a href="#">G</a>
        <a href="#">H</a>
        <a href="#">I</a>
        <a href="#">J</a>
        <a href="#">K</a>
        <a href="#">L</a>
        <a href="#">M</a>
        <a href="#">N</a>
        <a href="#">O</a>
        <a href="#">P</a>
        <a href="#">Q</a>
        <a href="#">R</a>
        <a href="#">S</a>
        <a href="#">T</a>
        <a href="#">U</a>
        <a href="#">V</a>
        <a href="#">W</a>
        <a href="#">X</a>
        <a href="#">Y</a>
        <a href="#">Z</a>
      </div>
    </div>

    <!-- Spinner -->
    <div class="loading-spinner" id="loading-spinner">
      <div class="spinner"></div>
      <p style="color: #B6C0D7;">Loading In-Store inventory records...</p>
    </div>

    <!-- Results Crate -->
    <div class="panel" style="background: rgba(0,0,0,0.18);">
      <div class="results-list" id="results-list">
        <!-- Records injected here -->
      </div>

      <!-- Pagination Controls -->
      <div class="pagination-container" id="pagination-controls" style="display: none;">
        <button class="page-btn" id="prev-page-btn" disabled>&larr; Previous</button>
        <span class="page-info" id="page-info">Page 1 of 1</span>
        <button class="page-btn" id="next-page-btn" disabled>Next &rarr;</button>
      </div>
    </div>
  </div>

  <footer style="margin-top: auto; text-align: center; padding-top: 2rem; padding-bottom: 2rem; position: relative; z-index: 10; width: 100%;">
    <a href="https://xenohead.com" target="_blank"
      style="text-decoration: none; color: #B6C0D7; display: inline-flex; flex-direction: column; align-items: center; gap: 0.5rem; transition: all 0.3s; opacity: 0.8;"
      onmouseover="this.style.opacity=1; this.style.transform='translateY(-2px)';"
      onmouseout="this.style.opacity=0.8; this.style.transform='translateY(0)';">
      <img src="images/xenohead_logo.png" alt="XenoHead" style="height: 40px;">
      <span style="font-family: 'Oswald', sans-serif; letter-spacing: 1px; font-size: 0.9rem; text-transform: uppercase;">A XenoHead Creation</span>
    </a>
  </footer>

  <script>
    // State management
    let currentPage = 1;
    let currentLimit = 10;
    let activeLetter = '';
    let lastSearchParams = {};

    // DOM Elements
    const searchForm = document.getElementById('search-form');
    const searchQuery = document.getElementById('search-query');
    const searchLimit = document.getElementById('search-limit');
    const letterIndex = document.getElementById('letter-index');
    const resultsList = document.getElementById('results-list');
    const loadingSpinner = document.getElementById('loading-spinner');
    const paginationControls = document.getElementById('pagination-controls');
    const prevPageBtn = document.getElementById('prev-page-btn');
    const nextPageBtn = document.getElementById('next-page-btn');
    const pageInfo = document.getElementById('page-info');

    // Search Execution
    async function performSearch(params = {}) {
      resultsList.innerHTML = '';
      loadingSpinner.style.display = 'block';
      paginationControls.style.display = 'none';

      const urlParams = new URLSearchParams();
      if (params.query) urlParams.set('query', params.query);
      if (params.letter) urlParams.set('letter', params.letter);
      
      urlParams.set('page', currentPage);
      urlParams.set('limit', currentLimit);

      try {
        const response = await fetch(`/api/inventory-search?${urlParams.toString()}`);
        const data = await response.json();
        
        loadingSpinner.style.display = 'none';

        if (data.success && data.results && data.results.length > 0) {
          data.results.forEach(item => {
            const card = document.createElement('div');
            card.className = 'record-card';
            
            // Choose placeholder art
            const colors = ['#2C6CFF', '#0A2C74', '#FFD447', '#2ecc71', '#e74c3c', '#9b59b6'];
            const randomColor = colors[item.id % colors.length];
            const artHtml = `
              <div class="placeholder-art" style="background: ${randomColor}; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative;">
                <span style="font-family: 'Oswald', sans-serif; font-size: 1.2rem; opacity: 0.3; font-weight: 700; color: #fff;">${item.Format || 'LP'}</span>
              </div>
            `;

            card.innerHTML = `
              <div class="record-art">
                ${artHtml}
              </div>
              <div class="record-info">
                <div class="record-text">
                  <div class="record-title" title="${item.Title || 'Unknown Title'}">${item.Title || 'Unknown Title'}</div>
                  <div class="record-artist" title="${item.Artist || 'Unknown Artist'}">${item.Artist || 'Unknown Artist'}</div>
                </div>
                <div class="record-details">
                  <span><strong>Format:</strong> ${item.Format || 'N/A'}</span>
                  <span><strong>Vendor/Label:</strong> ${item.Vendor || 'N/A'}</span>
                  <span><strong>Cat #:</strong> ${item.Vendor_Number || 'N/A'}</span>
                  <span><strong>UPC:</strong> ${item.UPC || 'N/A'}</span>
                  <span><strong>Quantity:</strong> ${item.Quantity || 0}</span>
                  <span><strong>Year:</strong> ${item.Year || 'N/A'}</span>
                  <span><strong>OOP:</strong> ${item.OOP || 'No'}</span>
                </div>
                <div class="record-price">
                  <span>${item.SRP || 'Call for Price'}</span>
                </div>
              </div>
            `;
            
            resultsList.appendChild(card);
          });

          // Show & update pagination controls
          const totalPages = Math.ceil(data.total / currentLimit) || 1;
          pageInfo.textContent = `Page ${currentPage} of ${totalPages} (${data.total} total items)`;
          prevPageBtn.disabled = currentPage === 1;
          nextPageBtn.disabled = currentPage === totalPages;
          paginationControls.style.display = 'flex';
          
        } else {
          resultsList.innerHTML = '<div style="text-align: center; padding: 3rem; color: #B6C0D7; font-size: 1.2rem; font-style: italic;">No matching in-store products found.</div>';
          paginationControls.style.display = 'none';
        }
      } catch (err) {
        console.error(err);
        loadingSpinner.style.display = 'none';
        resultsList.innerHTML = '<div style="text-align: center; padding: 3rem; color: #e74c3c;">Failed to load in-store inventory data.</div>';
        paginationControls.style.display = 'none';
      }
    }

    function executeSearch() {
      performSearch(lastSearchParams);
    }

    // Form submission listener
    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      currentPage = 1;
      currentLimit = parseInt(searchLimit.value, 10);
      activeLetter = '';
      
      // Remove active class from letters
      document.querySelectorAll('.browse-letters a').forEach(a => a.classList.remove('active'));

      lastSearchParams = {
        query: searchQuery.value.trim()
      };
      executeSearch();
    });

    // Letter index listener
    const letterLinks = document.querySelectorAll('.browse-letters a');
    letterLinks.forEach(letterLink => {
      const letter = letterLink.textContent.trim();
      letterLink.addEventListener('click', (e) => {
        e.preventDefault();
        
        // Toggle active letter state
        letterLinks.forEach(a => a.classList.remove('active'));
        letterLink.classList.add('active');
        
        currentPage = 1;
        currentLimit = parseInt(searchLimit.value, 10);
        searchQuery.value = ''; // Clear search text when letter-browsing
        
        lastSearchParams = {
          letter: letter === '#' ? '0-9' : letter
        };
        executeSearch();
      });
    });

    // Pagination button listeners
    prevPageBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        executeSearch();
        window.scrollTo({ top: searchForm.offsetTop - 50, behavior: 'smooth' });
      }
    });

    // Next page listener
    nextPageBtn.addEventListener('click', () => {
      currentPage++;
      executeSearch();
      window.scrollTo({ top: searchForm.offsetTop - 50, behavior: 'smooth' });
    });

    // Load initial empty list placeholder
    resultsList.innerHTML = '<div style="text-align: center; padding: 3rem; color: #B6C0D7; font-size: 1.2rem; font-style: italic;">Use the lookup field above to search In-Store products.</div>';
  </script>
</body>

</html>
